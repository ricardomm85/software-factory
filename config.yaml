# Factory roster: one entry per agent — who it is, not how it is used.
# Call sites (chain scripts) name agents; they never name a model.
defaults:
  coding_agent: pi                 # v1 runs pi only
  model: zai/glm-5.3-flash         # provider/model-id, always
  thinking: medium                 # off|minimal|low|medium|high|xhigh|max — quote 'off' (YAML parses bare off/on as booleans)
  data_dir: data                   # runtime trace + sessions (gitignored)
  test_command: uv run pytest -q   # the real suite for code(test) phases — never a placeholder
  checkpoint: false                # ask the human before the final commit lands (plan-build-test)
  max_concurrent_runs: 1           # global cap on simultaneous runs — size it to the box's RAM
                                   # (the target repos' Chrome E2E suites are the heavy part)

# The board (factory serve) offers exactly these repos, by name.
# test_command is optional per repo and falls back to defaults.test_command.
repos:
  - name: software-factory
    path: ~/Projects/software-factory

agents:
  - name: scout
    purpose: Read-only recon; answer questions about the repo without changing anything.

  - name: planner
    thinking: high                 # same model for every agent for now; effort is what differs
    purpose: Turn a request into a plan the builder can implement without asking questions.

  - name: builder
    purpose: Implement the plan; propose a commit message; leave only what the plan allows.

  - name: review-conventions
    thinking: medium
    purpose: Audit changes against AGENTS.md conventions and the repo's stated rules.

  - name: review-bugs
    thinking: high
    purpose: Hunt real bugs in the changes — large defects only, no nitpicks.

  - name: scorer
    thinking: medium
    purpose: Verify reported findings against the code and score 0-100 confidence they are real.
