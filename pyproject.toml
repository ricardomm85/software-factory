[project]
name = "factory"
version = "0.1.0"
description = "Personal software factory: a Python orchestrator that owns the agentic SDLC loop."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "pydantic>=2.7"]

[project.scripts]
factory = "factory.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]
